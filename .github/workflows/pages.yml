name: Deploy site to Pages

# The apps moved to lawwu/lawrencewu-net (apps/web), served at
# https://apps.lawrencewu.net. This workflow now deploys only the
# redirect pages so old GitHub Pages links keep working.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble redirect-only site
        run: |
          mkdir dist
          cp index.html 404.html dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
